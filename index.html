<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChJNL - Dev Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Code', 'Courier New', monospace;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                linear-gradient(90deg, rgba(88, 166, 255, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(88, 166, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            padding: 40px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.1) 0%, rgba(165, 142, 251, 0.1) 100%);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '> ';
            color: #58a6ff;
            font-weight: bold;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #58a6ff 0%, #a58efc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            letter-spacing: 2px;
        }

        header p {
            font-size: 0.95em;
            color: #8b949e;
            margin-bottom: 5px;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background: rgba(3, 102, 214, 0.2);
            border: 1px solid #0969da;
            border-radius: 20px;
            font-size: 0.85em;
            color: #58a6ff;
        }

        .status::before {
            content: '● ';
            color: #3fb950;
        }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .repo-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .repo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #58a6ff, transparent);
            transition: left 0.5s ease;
        }

        .repo-card:hover {
            border-color: #58a6ff;
            background: #0d1117;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.1);
        }

        .repo-card:hover::before {
            left: 100%;
        }

        .repo-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .repo-icon {
            color: #58a6ff;
            font-size: 1.2em;
        }

        .repo-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #58a6ff;
            word-break: break-word;
            font-family: 'Fira Code', monospace;
        }

        .repo-description {
            color: #8b949e;
            font-size: 0.9em;
            line-height: 1.6;
            margin-bottom: 16px;
            flex-grow: 1;
            border-left: 2px solid #30363d;
            padding-left: 12px;
        }

        .repo-meta {
            display: flex;
            gap: 16px;
            font-size: 0.8em;
            color: #8b949e;
            border-top: 1px solid #30363d;
            padding-top: 12px;
            flex-wrap: wrap;
        }

        .repo-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s ease;
        }

        .repo-card:hover .repo-meta span {
            color: #58a6ff;
        }

        .language-tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(88, 166, 255, 0.15);
            border: 1px solid #58a6ff;
            border-radius: 4px;
            color: #58a6ff;
            font-size: 0.8em;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            color: #58a6ff;
            font-size: 1em;
        }

        .spinner {
            border: 2px solid #30363d;
            border-top: 2px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #161b22;
            border: 1px solid #da3633;
            color: #f85149;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            margin: 20px 0;
            font-family: 'Fira Code', monospace;
        }

        .empty {
            text-align: center;
            color: #8b949e;
            font-size: 1em;
            padding: 60px 20px;
            border: 1px dashed #30363d;
            border-radius: 6px;
            background: #161b22;
        }

        .footer {
            text-align: center;
            color: #8b949e;
            font-size: 0.85em;
            padding-top: 30px;
            border-top: 1px solid #30363d;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .repos-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ChJNL</h1>
            <p>// Full Stack Developer</p>
            <div class="status">Status: Active</div>
        </header>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>$ loading repositories...</p>
            </div>
        </div>

        <div class="footer">
            <p>// Made with ❤️ by ChJNL</p>
        </div>
    </div>

    <script>
        const GITHUB_USER = 'ChJNL';
        const EXCLUDE_REPOS = ['portfolio'];
        const GITHUB_PAGES_URL = 'https://ChJNL.github.io';

        async function fetchRepositories() {
            try {
                const response = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch repositories');
                }

                let repos = await response.json();

                repos = repos.filter(repo => 
                    !repo.fork && 
                    !EXCLUDE_REPOS.includes(repo.name)
                );

                repos.sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));

                displayRepositories(repos);
            } catch (error) {
                displayError(error.message);
            }
        }

        function displayRepositories(repos) {
            const content = document.getElementById('content');

            if (repos.length === 0) {
                content.innerHTML = '<div class="empty">$ No public repositories found</div>';
                return;
            }

            const cardsHTML = repos.map(repo => `
                <div class="repo-card" onclick="goToRepo('${repo.name}')">
                    <div class="repo-header">
                        <span class="repo-icon">📦</span>
                        <div class="repo-name">${repo.name}</div>
                    </div>
                    <div class="repo-description">
                        ${repo.description || '// No description provided'}
                    </div>
                    <div class="repo-meta">
                        ${repo.language ? `<span class="language-tag">${repo.language}</span>` : ''}
                        <span>⭐ ${repo.stargazers_count}</span>
                        <span>🔀 ${repo.forks_count}</span>
                    </div>
                </div>
            `).join('');

            content.innerHTML = `<div class="repos-grid">${cardsHTML}</div>`;
        }

        function displayError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="error">$ Error: ${message}</div>`;
        }

        function goToRepo(repoName) {
            window.location.href = `${GITHUB_PAGES_URL}/${repoName}/`;
        }

        fetchRepositories();
    </script>
</body>
</html>
