<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChJNL - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .repo-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .repo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .repo-name {
            font-size: 1.4em;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .repo-description {
            color: #666;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .repo-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 12px;
            flex-wrap: wrap;
        }

        .repo-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.1em;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }

        .empty {
            text-align: center;
            color: white;
            font-size: 1.1em;
            padding: 40px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .repos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 ChJNL Portfolio</h1>
            <p>My GitHub Projects</p>
        </header>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>저장소를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_USER = 'ChJNL';
        const EXCLUDE_REPOS = ['portfolio']; // 제외할 저장소 이름 (필요하면 추가)
        const GITHUB_PAGES_URL = 'https://ChJNL.github.io';

        async function fetchRepositories() {
            try {
                const response = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100`);
                
                if (!response.ok) {
                    throw new Error('GitHub API 요청 실패');
                }

                let repos = await response.json();

                // 포트폴리오 저장소 제외 및 포크된 저장소 제외
                repos = repos.filter(repo => 
                    !repo.fork && 
                    !EXCLUDE_REPOS.includes(repo.name)
                );

                // 업데이트된 순서대로 정렬
                repos.sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));

                displayRepositories(repos);
            } catch (error) {
                displayError(error.message);
            }
        }

        function displayRepositories(repos) {
            const content = document.getElementById('content');

            if (repos.length === 0) {
                content.innerHTML = '<div class="empty">공개 저장소가 없습니다.</div>';
                return;
            }

            const cardsHTML = repos.map(repo => `
                <div class="repo-card" onclick="goToRepo('${repo.name}')">
                    <div class="repo-name">📦 ${repo.name}</div>
                    <div class="repo-description">
                        ${repo.description || '(설명 없음)'}
                    </div>
                    <div class="repo-meta">
                        ${repo.language ? `<span>🔤 ${repo.language}</span>` : ''}
                        <span>⭐ ${repo.stargazers_count}</span>
                        <span>🔀 ${repo.forks_count}</span>
                    </div>
                </div>
            `).join('');

            content.innerHTML = `<div class="repos-grid">${cardsHTML}</div>`;
        }

        function displayError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="error">❌ 오류: ${message}</div>`;
        }

        function goToRepo(repoName) {
            window.location.href = `${GITHUB_PAGES_URL}/${repoName}/`;
        }

        // 페이지 로드 시 저장소 가져오기
        fetchRepositories();
    </script>
</body>
</html>
